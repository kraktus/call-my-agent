name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale, so dependency changes cannot land
      # without the lockfile being updated too.
      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

  actions-lock:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify .github/workflows/actions.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh actions-lock --verify
